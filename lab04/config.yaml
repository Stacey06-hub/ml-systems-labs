
dataset:
  name: adult
  version: 2
  target: class

split:
  test_size: 0.3
  random_state: 42

preprocessing:
  numeric_imputation: median
  categorical_imputation: most_frequent
  categorical_encoding: onehot
  numeric_scaling: standard
  outlier_clipping: true
  outlier_lower_percentile: 1
  outlier_upper_percentile: 99
  remove_training_duplicates: true

features:
  - capital_net
  - hours_per_age

model:
  name: logistic_regression
  max_iter: 1000
  random_state: 42
