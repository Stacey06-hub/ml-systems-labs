
dataset:
  name: adult
  version: 2
  target: class

split:
  test_size: 0.2
  random_state: 42

preprocessing:
  numeric_imputation: median
  categorical_imputation: most_frequent
  categorical_encoding: onehot
  numeric_scaling: standard

model:
  name: logistic_regression
  max_iter: 1000
  random_state: 42
